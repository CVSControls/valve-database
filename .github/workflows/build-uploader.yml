name: Build Windows Uploader

on:
  push:
    branches: [main]
    paths:
      - "uploader/**"
      - ".github/workflows/build-uploader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore uploader/ValveDatabaseUploader.slnx
      - name: Test
        run: dotnet test uploader/ValveDatabaseUploader.Tests/ValveDatabaseUploader.Tests.csproj -c Release --no-restore
      - name: Publish portable Windows app
        run: dotnet publish uploader/ValveDatabaseUploader/ValveDatabaseUploader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/ValveDatabaseUploader
      - name: Include setup guide
        shell: pwsh
        run: Copy-Item uploader/README.md artifacts/ValveDatabaseUploader/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ValveDatabaseUploader-win-x64
          path: artifacts/ValveDatabaseUploader
          if-no-files-found: error
