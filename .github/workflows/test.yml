name: Migration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  website-and-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-pages-build.mjs
      - name: Check SQL and role permissions
        env:
          PGPASSWORD: test-only-local
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/sql-bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/setup.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/sql-permissions.sql
